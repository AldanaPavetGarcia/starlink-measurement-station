[pytest]
# Semana 11-12 (CLAUDE.md §1.1): --cov-fail-under=80 en CI. `pytest tests/`
# solo (sin --cov) sigue funcionando igual para desarrollo local rápido --
# ver Makefile-less equivalente en README.md §Tests.
testpaths = tests
addopts = --cov=src --cov-report=term-missing --cov-fail-under=80
markers =
    integration: requiere Docker real (docker compose --profile mocks up) -- ver tests/integration/README o docs/08_Plan_QA.md §4. Se saltea sola si Docker no está disponible/accesible.
