name: Publish images (GHCR)

# Semana 11-12 (CLAUDE.md §1.1): cierra el pendiente "publicar mock-starlink
# a GHCR" del modelo polyrepo (docs/PROGRESS.md, "Coordinación pendiente con
# Fede") -- hasta ahora se construía siempre local (`build:` en
# docker-compose.yml), consistente con el modelo pero nunca publicado.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: mock-starlink
            dockerfile: Dockerfile
          - image: starlink-consumer
            dockerfile: Dockerfile.consumer
          - image: starlink-backend
            dockerfile: Dockerfile.backend
          - image: starlink-acquisition
            dockerfile: Dockerfile.acquisition
    steps:
      - uses: actions/checkout@v4

      - name: QEMU (necesario para el target arm64 del RPi5)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx (necesario para build multi-plataforma)
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # multi-arch (amd64/arm64, ADR-05/ADR-12): mismo criterio que el
          # RPi5 de semana 10 -- una sola imagen sirve para desarrollo (PC) y
          # producción (RPi5) sin rebuild manual.
          platforms: linux/amd64,linux/arm64
