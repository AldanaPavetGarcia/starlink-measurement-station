services:
  broker:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto-broker
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./services/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./services/broker/conf.d:/mosquitto/config/conf.d
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -i healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ADR-07: microservicio Docker independiente. Nombre de imagen pensado para
  # GHCR (ghcr.io/aldanapavetgarcia/mock-starlink:tag) el día que se publique —
  # hoy se construye local con `build:`. Perfiles "mocks"/"stress" en línea con
  # los comandos que ya usa docs/08_Plan_QA.md.
  mock_starlink:
    build:
      context: .
      dockerfile: Dockerfile
    image: mock-starlink:dev
    container_name: mock-starlink
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
      STARLINK_NODE_ID: ${STARLINK_NODE_ID:-lit-cordoba-01}
      CHAOS_PROFILE: ${CHAOS_PROFILE:-CALM}
      TIME_WARP_FACTOR: ${TIME_WARP_FACTOR:-1}
    profiles: [mocks, stress]

  # Semana 10 (CLAUDE.md §1.1): extractor real, reemplaza a mock_starlink
  # contra la antena física (192.168.100.1:9200). Perfil "real" propio, NO
  # "mocks" -- nunca deben correr los dos productores del mismo tópico a la
  # vez. No probado contra hardware real todavía (sin acceso presencial al
  # LIT en esta sesión, ver docs/PROGRESS.md §Semana 10).
  acquisition:
    build:
      context: .
      dockerfile: Dockerfile.acquisition
    image: starlink-acquisition:dev
    container_name: starlink-acquisition
    restart: unless-stopped
    network_mode: host  # necesita alcanzar 192.168.100.1 (red de la antena), no la red bridge de Docker
    environment:
      MQTT_HOST: ${MQTT_HOST:-localhost}
      MQTT_PORT: ${MQTT_PORT:-1883}
      STARLINK_NODE_ID: ${STARLINK_NODE_ID:-lit-cordoba-01}
      DISH_GRPC_ADDR: ${DISH_GRPC_ADDR:-192.168.100.1:9200}
      POLL_INTERVAL_S: ${POLL_INTERVAL_S:-60}
    profiles: [real]

  # ADR-10/ADR-11: instancia TimescaleDB propia del dominio Starlink,
  # independiente de meteo_db (que Fede todavía no levantó). Imagen pinneada
  # (nunca :latest en producción, ADR-12), verificada con `docker pull`. Sin
  # `ports`: ADR-14 dice que starlink_health_db NO se expone ni siquiera al
  # host -- solo el consumer y Grafana, ambos dentro de la red Docker, la
  # necesitan. Para psql manual usar `docker exec -it starlink-health-db psql ...`.
  starlink_db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: starlink-health-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STARLINK_DB_NAME:-starlink_health}
      POSTGRES_USER: ${STARLINK_DB_USER:-starlink_app}
      POSTGRES_PASSWORD: ${STARLINK_DB_PASSWORD:-starlink_dev_password}
    volumes:
      - starlink_db_data:/var/lib/postgresql/data
      - ./services/db/init_starlink_health.sql:/docker-entrypoint-initdb.d/init_starlink_health.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STARLINK_DB_USER:-starlink_app} -d ${STARLINK_DB_NAME:-starlink_health}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [mocks, stress]

  # ADR-10 (enmendado semana 7): tercera instancia, catálogo de nodos/sensores
  # (docs/06_DER.md §5.1-§5.2). PostgreSQL plano (sin TimescaleDB): son tablas
  # relacionales chicas, no series temporales. Tampoco expuesta (ADR-14).
  station_config_db:
    image: postgres:16.4-alpine
    container_name: station-config-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STATION_CONFIG_DB_NAME:-station_config}
      POSTGRES_USER: ${STATION_CONFIG_DB_USER:-station_config_app}
      POSTGRES_PASSWORD: ${STATION_CONFIG_DB_PASSWORD:-station_config_dev_password}
    volumes:
      - station_config_db_data:/var/lib/postgresql/data
      - ./services/db/init_station_config.sql:/docker-entrypoint-initdb.d/init_station_config.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STATION_CONFIG_DB_USER:-station_config_app} -d ${STATION_CONFIG_DB_NAME:-station_config}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [mocks, stress]

  # Semana 6 (CLAUDE.md §1.1): consumer del dominio Starlink únicamente --
  # Fede todavía no tiene su mock/tópico meteo, así que ese lado del router
  # (ver src/consumer/router.py) queda enrutado pero sin persistencia real.
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    image: starlink-consumer:dev
    container_name: starlink-consumer
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      starlink_db:
        condition: service_healthy
    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
      STARLINK_DB_HOST: starlink_db
      STARLINK_DB_PORT: 5432
      STARLINK_DB_NAME: ${STARLINK_DB_NAME:-starlink_health}
      STARLINK_DB_USER: ${STARLINK_DB_USER:-starlink_app}
      STARLINK_DB_PASSWORD: ${STARLINK_DB_PASSWORD:-starlink_dev_password}
    profiles: [mocks, stress]

  # Semana 9 (CLAUDE.md §1.1): backend FastAPI (docs/07_API_REST.md).
  # Endpoints /health, /metrics/starlink*, /nodes*, /ingest/starlink -- los de
  # dominio meteo (Fede) no se montan todavía. Publicado a la intranet del
  # LIT (no solo localhost) según la tabla de exposición de puertos de
  # ADR-14 ("Backend FastAPI | 8000 | ⚠️ Expuesto a la intranet del LIT --
  # acceso para integración y consultas ad-hoc del equipo de investigación
  # desde la red local"). Distinto de Grafana (✅ expuesto públicamente): acá
  # es solo intranet, protegido además por X-API-Key (ADR-14 "Medidas de
  # Seguridad Adicionales" pide filtrado de IP a nivel de firewall/router del
  # LIT para esto -- fuera del alcance de docker-compose, ver README.md).
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: starlink-backend:dev
    container_name: starlink-backend
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
      starlink_db:
        condition: service_healthy
      station_config_db:
        condition: service_healthy
    environment:
      MQTT_HOST: broker
      MQTT_PORT: 1883
      STARLINK_DB_HOST: starlink_db
      STARLINK_DB_PORT: 5432
      STARLINK_DB_NAME: ${STARLINK_DB_NAME:-starlink_health}
      STARLINK_DB_USER: ${STARLINK_DB_USER:-starlink_app}
      STARLINK_DB_PASSWORD: ${STARLINK_DB_PASSWORD:-starlink_dev_password}
      STATION_CONFIG_DB_HOST: station_config_db
      STATION_CONFIG_DB_PORT: 5432
      STATION_CONFIG_DB_NAME: ${STATION_CONFIG_DB_NAME:-station_config}
      STATION_CONFIG_DB_USER: ${STATION_CONFIG_DB_USER:-station_config_app}
      STATION_CONFIG_DB_PASSWORD: ${STATION_CONFIG_DB_PASSWORD:-station_config_dev_password}
      # Sin default "seguro" real a propósito -- BACKEND_API_KEY es un secreto,
      # no una contraseña de DB de desarrollo. El valor de acá es solo para no
      # romper `docker compose up` sin .env configurado; cambiarlo siempre
      # antes de cualquier despliegue real (docs/07_API_REST.md §2.1: generar
      # con `python -c "import secrets; print(secrets.token_hex(32))"`).
      BACKEND_API_KEY: ${BACKEND_API_KEY:-change_me_backend_api_key_dev_only}
      ENABLE_INGEST_ENDPOINT: ${ENABLE_INGEST_ENDPOINT:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    profiles: [mocks, stress]

  # Semana 8 (CLAUDE.md §1.1): dashboard "Red Starlink" (ADR-13). Único
  # servicio expuesto públicamente a propósito (ADR-14) -- backend arriba se
  # publica solo en localhost, no hacia afuera. Provisioning como código:
  # datasource + dashboard JSON se cargan solos al arrancar.
  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: starlink-grafana
    restart: unless-stopped
    depends_on:
      starlink_db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_dev_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      STARLINK_DB_NAME: ${STARLINK_DB_NAME:-starlink_health}
      STARLINK_DB_USER: ${STARLINK_DB_USER:-starlink_app}
      STARLINK_DB_PASSWORD: ${STARLINK_DB_PASSWORD:-starlink_dev_password}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    profiles: [mocks, stress]

volumes:
  mosquitto_data:
  mosquitto_log:
  starlink_db_data:
  station_config_db_data:
  grafana_data:
